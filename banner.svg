<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Ingeniería Industrial: analítica y toma de decisiones</title>
  <desc id="d">Letrero animado en rojo y negro con texto en movimiento y engranajes girando.</desc>

  <defs>
    <!-- Brillo rojo del texto -->
    <filter id="brillo" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Desvanecido a los lados del texto -->
    <linearGradient id="izq" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0a0a0a" stop-opacity="1"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="der" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0a0a0a" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="120" rx="12" fill="#0a0a0a"/>
  <rect width="1200" height="3" fill="#ff2d3d"/>
  <rect y="117" width="1200" height="3" fill="#ff2d3d"/>

  <!-- TEXTO EN MOVIMIENTO: cambia las palabras aquí (las 3 copias deben ser iguales) -->
  <g font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="32" font-weight="700"
     fill="#ff2d3d" filter="url(#brillo)" xml:space="preserve">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1800 0" dur="28s" repeatCount="indefinite"/>
    <text x="0"    y="73" textLength="1800" lengthAdjust="spacing">INGENIERÍA INDUSTRIAL  •  ANALÍTICA Y TOMA DE DECISIONES  •  MEJORA CONTINUA  •  </text>
    <text x="1800" y="73" textLength="1800" lengthAdjust="spacing">INGENIERÍA INDUSTRIAL  •  ANALÍTICA Y TOMA DE DECISIONES  •  MEJORA CONTINUA  •  </text>
    <text x="3600" y="73" textLength="1800" lengthAdjust="spacing">INGENIERÍA INDUSTRIAL  •  ANALÍTICA Y TOMA DE DECISIONES  •  MEJORA CONTINUA  •  </text>
  </g>

  <!-- Panel izquierdo con engranajes -->
  <rect x="0" y="3" width="190" height="114" fill="#0a0a0a"/>
  <rect x="190" y="3" width="70" height="114" fill="url(#izq)"/>
  <rect x="1140" y="3" width="60" height="114" fill="url(#der)"/>

  <g fill="none" stroke="#ff2d3d" stroke-width="6">
    <!-- Engranaje grande -->
    <g transform="translate(66 60)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
        <circle r="22"/>
        <circle r="7" fill="#ff2d3d" stroke="none"/>
        <g fill="#ff2d3d" stroke="none">
          <rect x="-5" y="-37" width="10" height="15" rx="2"/>
          <rect x="-5" y="-37" width="10" height="15" rx="2" transform="rotate(45)"/>
          <rect x="-5" y="-37" width="10" height="15" rx="2" transform="rotate(90)"/>
          <rect x="-5" y="-37" width="10" height="15" rx="2" transform="rotate(135)"/>
          <rect x="-5" y="-37" width="10" height="15" rx="2" transform="rotate(180)"/>
          <rect x="-5" y="-37" width="10" height="15" rx="2" transform="rotate(225)"/>
          <rect x="-5" y="-37" width="10" height="15" rx="2" transform="rotate(270)"/>
          <rect x="-5" y="-37" width="10" height="15" rx="2" transform="rotate(315)"/>
        </g>
      </g>
    </g>
    <!-- Engranaje pequeño (gira al revés) -->
    <g transform="translate(130 82)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
        <circle r="11" stroke-width="5"/>
        <circle r="4" fill="#ff2d3d" stroke="none"/>
        <g fill="#ff2d3d" stroke="none">
          <rect x="-3.5" y="-24" width="7" height="11" rx="1.5"/>
          <rect x="-3.5" y="-24" width="7" height="11" rx="1.5" transform="rotate(60)"/>
          <rect x="-3.5" y="-24" width="7" height="11" rx="1.5" transform="rotate(120)"/>
          <rect x="-3.5" y="-24" width="7" height="11" rx="1.5" transform="rotate(180)"/>
          <rect x="-3.5" y="-24" width="7" height="11" rx="1.5" transform="rotate(240)"/>
          <rect x="-3.5" y="-24" width="7" height="11" rx="1.5" transform="rotate(300)"/>
        </g>
      </g>
    </g>
  </g>
</svg>
